<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BeeOrganizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <div class="title">
      <strong>BeeOrganizer</strong>
      <span id="status" class="status">AI names every download</span>
    </div>
    <label class="switch" title="Auto-rename downloads">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="settings">
    <label>OpenAI API key
      <div class="row">
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <button id="testKey" type="button">Test</button>
      </div>
      <span class="hint">Stored only in this browser. Get one at platform.openai.com/api-keys</span>
    </label>
    <label>Model
      <input type="text" id="model" list="models" spellcheck="false">
      <datalist id="models">
        <option value="gpt-5-mini">
        <option value="gpt-5">
        <option value="gpt-4.1-mini">
        <option value="gpt-4o-mini">
      </datalist>
    </label>
    <div class="two">
      <label>Name style
        <select id="style">
          <option value="Title_Case">Title_Case</option>
          <option value="Spaces">Title With Spaces</option>
          <option value="snake_case">snake_case</option>
          <option value="kebab-case">kebab-case</option>
        </select>
      </label>
      <label>Save into
        <select id="folderMode">
          <option value="none">Downloads folder</option>
          <option value="site">Folder per website</option>
          <option value="type">Folder per type</option>
        </select>
      </label>
    </div>
    <details>
      <summary>More options</summary>
      <div class="more">
        <label>Max file size to read (MB)
          <input type="number" id="maxSizeMB" min="1" max="100">
        </label>
        <label>Never rename these extensions
          <input type="text" id="skipExtensions" spellcheck="false">
        </label>
        <label class="check"><input type="checkbox" id="notify"> Notify me for each download</label>
      </div>
    </details>
  </section>

  <section class="recent">
    <div class="recent-head">
      <strong>Recent downloads</strong>
      <button id="clear" class="link" type="button">Clear</button>
    </div>
    <ul id="history"></ul>
    <p id="empty" class="muted">Nothing yet. Download a file to see its new name here.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
