# Builds BeeOrganizer for Windows (Setup.exe) and macOS (.dmg) and attaches them to a GitHub Release.
#
# Runs when a release is published (or manually). Windows binaries are code-signed through
# SignPath when the repository has these settings (Settings > Secrets and variables > Actions):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
# Without them, the build still works and the files are simply unsigned.

name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (e.g. v1.3.0)"
        required: true
      ref:
        description: "Branch or commit to build (default: the tag itself)"
        required: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  BUILD_REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build BeeOrganizer.exe
        run: python -m PyInstaller --clean --noconfirm smart_file_organizer.spec

      - name: Upload unsigned exe (for signing)
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/BeeOrganizer.exe

      - name: Sign exe with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Use signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed-exe/BeeOrganizer.exe dist/BeeOrganizer.exe -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "$env:TAG".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\BeeOrganizer.iss

      - name: Upload unsigned setup (for signing)
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/BeeOrganizer-Setup.exe

      - name: Sign setup with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use signed setup
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item signed-setup/BeeOrganizer-Setup.exe dist/BeeOrganizer-Setup.exe -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BeeOrganizer-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build BeeOrganizer.app
        run: python -m PyInstaller --clean --noconfirm smart_file_organizer.spec

      - name: Build .dmg (drag to Applications)
        run: |
          mkdir -p dmg
          cp -R dist/BeeOrganizer.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "BeeOrganizer" -srcfolder dmg -ov -format UDZO "dist/BeeOrganizer-mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/BeeOrganizer-mac-${{ matrix.arch }}.dmg

  publish:
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
